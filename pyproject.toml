[project]
name = "matchplay-score"
version = "1.0.0"
description = "Code and Development for the Front End of the Scoring System for Tournaments that utilize card-based scoring"
readme = "README.md"
license-files = ["LICENSE.txt"]
authors = [
    { name = "arborelia", email = "gh@arborelia.net" }
]
requires-python = ">=3.14"
dependencies = [
    "cachetools>=7.2.8",
    "flask>=3.1.3",
    "loguru>=0.7.3",
    "requests>=2.34.2",
    "vercel>=0.12.2",
    "waitress>=3.0.2",
]

[project.scripts]
matchplay-score = "matchplay_score:main"
scorehigh = "matchplay_score:main"

[project.urls]
Homepage = "https://ashodinventeal.github.io/scorehigh/"
Repository = "https://github.com/AshodinVenteal/scorehigh"
Issues = "https://github.com/AshodinVenteal/scorehigh/issues"

[build-system]
requires = ["uv_build>=0.12.11,<0.13.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
source-include = ["tests/**", "tools/**", "PUBLISHER.md", ".github/workflows/pages.yml", ".gitignore", "uv.lock", ".python-version"]

[dependency-groups]
dev = [
    "pytest",
    "ruff",
    "ipython",
    "fakeredis[lua]>=2.40.0",
]

[tool.vercel]
entrypoint = "src.matchplay_score.web:app"

[tool.pytest.ini_options]
addopts = "-m 'not integration'"
markers = ["integration: reads the public Match Play API"]

[tool.ruff.format]
line-ending = "lf"
